# Camera profile for small indoor flames. It does not change YOLO weights.
temporal_mode: tpt

tracker:
  iou_threshold: 0.15
  center_distance_threshold: 1.5
  max_misses: 12
  max_missed_seconds: 1.5
  max_history: 64
  max_timestamp_gap: 5.0
  prediction_horizon_seconds: 0.75

# Lower only fire. Keeping smoke at the validated value limits extra load.
candidate_confidence:
  fire: 0.30
  smoke: 0.20
default_candidate_confidence: 0.25

classes:
  fire:
    window_size: 5
    min_hits: 3
    min_track_duration: 0.4
    min_confidence: 0.30
    high_confidence: 0.80
    max_misses: 2
  smoke:
    window_size: 5
    min_hits: 3
    min_track_duration: 2.0
    min_confidence: 0.25
    high_confidence: 0.85
    max_misses: 2

# Retained so this profile can still be switched to AVT from the CLI.
avt_classes:
  fire:
    window_size: 20
    area_threshold: 0.05
    min_samples: 2
    min_track_duration: 0.0
  smoke:
    window_size: 20
    area_threshold: 0.05
    min_samples: 2
    min_track_duration: 0.0

ignore_regions: []
