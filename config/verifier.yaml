clip:
  seconds: 3.2
  buffer_fps: 10.0
  frames: 32
  rgb_frames: 16
  image_size: 224
  roi_scale: 1.5

frequency:
  minimum_fps: 8.0
  minimum_frames: 26
  maximum_frame_gap: 0.25

verification_fps: 10.0

voting:
